name: coletor-b3

on:
  schedule:
    - cron: "0 9,15,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: instalar dependencias
        run: pip install -r requirements.txt

      - name: rodar coletor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run.py

      - name: publicar JSONs
        run: |
          git config user.name "coletor-bot"
          git config user.email "coletor-bot@users.noreply.github.com"
          git add output/
          git commit -m "dados" || echo "sem mudancas"
          git push
